<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
<title id="t">Shreyash Meshram — full-stack &amp; AI engineer</title>
<desc id="d">A chart-recorder trace of a career: diploma 2019, BE 2022, internships 2024, MSc 2025, now.</desc>
<style>
text{font-family:'Martian Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.lbl{font-size:13px;fill:#70839b}
.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.8s linear 0.2s both}
.mk,.dot{animation:in 200ms cubic-bezier(0.23, 1, 0.32, 1) var(--d,0s) both}
.dot{--d:2.00s}
.pulse{opacity:0;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s cubic-bezier(0.23, 1, 0.32, 1) 2.00s infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes pulse{from{transform:scale(1);opacity:.6}to{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){
.trace{animation:in .4s ease both}
.mk,.dot{animation-delay:0s}
.pulse{display:none}
}
</style>
